<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="route" x1="14" y1="48" x2="50" y2="14" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#3b82f6" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Escudo base -->
  <rect width="64" height="64" rx="16" fill="url(#bg)" />
  <rect x="1.25" y="1.25" width="61.5" height="61.5" rx="14.75" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5" />

  <!-- Retícula cartográfica sutil -->
  <path d="M16 14H48M16 32H48M16 50H48" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1" stroke-linecap="round" />

  <!-- Trazo de ruta principal -->
  <path
    d="M17 47C17 35 26 35 32 32C38 29 47 29 47 17"
    stroke="url(#route)"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glow)"
  />

  <!-- Nodo de origen (Base) -->
  <circle cx="17" cy="47" r="6" fill="#0f172a" stroke="#38bdf8" stroke-width="3.5" />
  <circle cx="17" cy="47" r="2" fill="#f8fafc" />

  <!-- Parada intermedia -->
  <circle cx="32" cy="32" r="4" fill="#0f172a" stroke="#60a5fa" stroke-width="3" />

  <!-- Nodo destino (Pin activo) -->
  <circle cx="47" cy="17" r="7" fill="#10b981" />
  <circle cx="47" cy="17" r="3" fill="#ffffff" />
</svg>
